name: Build iOS locally and submit to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ios-3d-tracking-scoring
    paths:
      - .github/workflows/testflight-local-ios.yml

concurrency:
  group: formie-testflight-local-ios
  cancel-in-progress: true

jobs:
  build-and-submit:
    name: Build signed IPA and submit
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.8.0
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify critical mobile release flows
        timeout-minutes: 8
        run: >-
          npx jest --runInBand --silent --forceExit
          src/screens/auth/auth-screens.test.tsx
          src/features/auth/auth-provider.test.tsx
          src/screens/onboarding/approved-onboarding.test.tsx
          src/screens/home/home.test.tsx
          src/screens/results/results.test.tsx
          src/screens/camera/camera-controls.test.tsx
          src/features/billing/purchases.native.test.ts
          src/features/billing/billing-provider.test.ts
          src/features/billing/purchase-reconciliation.test.ts
          src/features/access/access-provider.runtime.test.tsx
          src/features/access/security-grants-migration.test.ts
          supabase/functions/revenuecat-webhook/handler.test.ts
          supabase/functions/refresh-entitlement/handler.test.ts

      - name: Verify mobile lint
        timeout-minutes: 5
        run: npm run lint

      - name: Verify mobile TypeScript
        timeout-minutes: 5
        run: npm run typecheck

      - name: Install website dependencies
        working-directory: website
        run: npm ci --no-audit --no-fund

      - name: Verify website CSS and production bundle
        working-directory: website
        run: |
          npm test -- --runInBand
          npm run lint
          npm run build

      - name: Validate production payment and auth environment
        run: >-
          eas env:exec production
          'node -e "const checks=[/^appl_/.test(String(process.env.EXPO_PUBLIC_REVENUECAT_IOS_PUBLIC_KEY)),Boolean(process.env.EXPO_PUBLIC_REVENUECAT_ENTITLEMENT_ID),Boolean(process.env.EXPO_PUBLIC_REVENUECAT_PRODUCT_ID),Boolean(process.env.EXPO_PUBLIC_REVENUECAT_OFFERING_ID),Boolean(process.env.EXPO_PUBLIC_SUPABASE_URL),Boolean(process.env.EXPO_PUBLIC_SUPABASE_ANON_KEY)];if(checks.some((value)=>!value))process.exit(1)"'
          --non-interactive

      - name: Build signed IPA on GitHub macOS
        run: eas build --platform ios --profile production --local --non-interactive --output ./Formie.ipa

      - name: Submit IPA to TestFlight
        run: eas submit --platform ios --profile production --path ./Formie.ipa --non-interactive --wait
