name: Build iOS locally and submit to TestFlight

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fix-analysis-billing-v70
    paths:
      - .github/workflows/testflight-local-ios.yml

concurrency:
  group: formie-testflight-local-ios
  cancel-in-progress: false

jobs:
  build-and-submit:
    name: Build signed IPA and submit
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Check out release branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: 21.8.0
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci

      - name: Build signed IPA on GitHub macOS
        run: eas build --platform ios --profile production --local --non-interactive --output ./Formie.ipa

      - name: Submit IPA to TestFlight
        run: eas submit --platform ios --profile production --path ./Formie.ipa --non-interactive --wait
