[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "form-video-worker"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "google-genai>=1.56,<2",
  "jsonschema>=4.25,<5",
  "mediapipe>=0.10.30,<0.11",
  "numpy>=2.0,<3",
  "opencv-python-headless>=4.11,<5",
  "supabase>=2.27,<3",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["form_worker*"]
