project_id = "form-ai-coach"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:8082"
additional_redirect_urls = ["form://auth/callback"]
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = true

[auth.rate_limit]
email_sent = 30

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = true
max_frequency = "1m"
otp_length = 6

[auth.email.smtp]
enabled = true
host = "smtp.resend.com"
port = 587
user = "resend"
pass = "env(FORMIE_RESEND_SMTP_PASS)"
admin_email = "auth@useformie.com"
sender_name = "Formie"

[auth.email.template.confirmation]
subject = "{{ .Token }} is your Formie verification code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "{{ .Token }} is your Formie password reset code"
content_path = "./supabase/templates/recovery.html"

[auth.email.template.email_change]
subject = "{{ .Token }} is your Formie email verification code"
content_path = "./supabase/templates/email-change.html"

[auth.email.template.reauthentication]
subject = "{{ .Token }} is your Formie security code"
content_path = "./supabase/templates/reauthentication.html"

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "250MiB"

[functions.coach-chat]
verify_jwt = true

[functions.cleanup-expired-analyses]
verify_jwt = false

[functions.send-feedback]
verify_jwt = true

[functions.exercise-guide]
verify_jwt = true

[functions.recording-preflight]
verify_jwt = true

[functions.send-support]
verify_jwt = false
